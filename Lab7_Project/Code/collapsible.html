<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Collapsible</title>
    <link rel="stylesheet" href="collapsible.css">
</head>
<body>

<div class="container">
    <h2>Collapsible Sections</h2>

    <button class="collapsible">
        Section 1 <span class="icon">▼</span>
    </button>
    <div class="content">
        <p>This is content for section one.</p>
    </div>

    <button class="collapsible">
        Section 2 <span class="icon">▼</span>
    </button>
    <div class="content">
        <p>This is content for section two.</p>
    </div>

    <button class="collapsible">
        Section 3 <span class="icon">▼</span>
    </button>
    <div class="content">
        <p>This is content for section three.</p>
    </div>
</div>

<script src="collapsible.js"></script>
</body>
</html>
